name: Build, Push, and Update GitOps Manifests

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Short SHA
        id: vars
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-app:${{ env.SHORT_SHA }}
            ghcr.io/${{ github.repository_owner }}/devops-app:latest

      - name: Checkout GitOps Manifests Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops-manifests
          token: ${{ secrets.GITOPS_TOKEN }}
          path: manifests-repo

      - name: Update Deployment Image Tag
        run: |
          cd manifests-repo
          sed -i "s|image: .*|image: ghcr.io/${{ github.repository_owner }}/devops-app:${{ env.SHORT_SHA }}|g" deployment.yaml
          git config user.name "GitHub Actions CI"
          git config user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "Auto-update image tag to ${{ env.SHORT_SHA }} [skip ci]" || exit 0
          git push origin main
